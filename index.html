    window.__EMBEDDED_WIKI__ = {"AGENTS.md": "# AGENTS.md — 個人研究知識庫（LLM Wiki）協作規範\n\n本文件是本專案的核心配置檔（Schema），參考 Andrej Karpathy 的 **LLM Wiki** 架構設計。所有 AI Agent（如 Claude Code、OpenAI Codex、Cursor、OpenCode、Gemini 等）在本專案中讀取、撰寫或維護內容時，**必須嚴格遵守本規範**。\n\n---\n\n## 1. 核心理念：累積式知識編譯（Compounding Knowledge）\n\n本專案不是傳統的「臨時檢索問答（RAG）」，而是一個**持續累積、高度互連的持久化知識庫（Persistent Wiki）**。\n- **一次編譯，持續更新**：當新論文或技術文章加入時，AI 不只是摘要它，而是將關鍵洞見整合進既有的概念頁、模型／方法頁與總覽中，主動更新交叉引用，並標註新舊觀點的演進或矛盾。\n- **人機分工**：人類負責挑選高品質原始資料、提出研究問題與審閱方向；AI 負責所有繁瑣的原文歸檔、摘要、分類、雙向連結維護、索引更新與一致性檢查。\n\n---\n\n## 2. 三層式專案架構（Three-Layer Architecture）\n\n```text\nllm-research-wiki/\n├── AGENTS.md                 # [Schema層] 本規範文件：定義結構、格式與標準作業流程\n├── README.md                 # 專案說明與 GitHub Pages / Obsidian 使用指南\n├── index.html                # 網頁閱讀器入口（供 GitHub Pages 直接渲染 wiki/ 內容）\n├── raw/                      # [原始資料層] 不可變動（Immutable）的原始文獻與素材\n│   ├── assets/               # 本地圖片與圖表附件（供離線與穩定引用）\n│   └── ...                   # 論文 PDF/Markdown、網頁剪藏、研究文章（存入後 AI 唯讀）\n└── wiki/                     # [知識庫層] 完全由 AI 維護的結構化 Markdown 知識庫\n    ├── index.md              # 內容導向總目錄（AI 每次新增/修改頁面必更新）\n    ├── log.md                # 時間軸操作日誌（Append-only，記錄每次 ingest/query/lint）\n    ├── overview.md           # 研究領域全景總覽與核心演進脈絡\n    ├── concepts/             # 核心技術與科學概念頁\n    ├── papers/               # 重要論文精讀與貢獻拆解頁\n    ├── models/               # 代表性模型、訓練架構或理論框架頁\n    └── comparisons/          # 橫向比較表與深度問答沉澱頁\n```\n\n### 嚴格權限邊界\n1. **`raw/` 目錄為唯讀歸檔區（Append-Only Raw Storage）**：\n   - 每當人類貼上新文章或提供新文獻（PDF / 網頁文字）時，AI **必須第一時間將原始內容完整保存至 `raw/` 資料夾**（使用小寫英文 kebab-case 命名，如 `raw/author-year-topic.md`；若為 PDF 則同時保留原檔與可檢索的 `.md` 文字版）。\n   - 一旦存入 `raw/`，該檔案即成為「單一事實來源（Source of Truth）」，AI **絕對禁止**修改、刪減或覆寫既有的原始文獻內容。\n2. **`wiki/` 目錄由 AI 全權維護**：AI 負責建立、重構與維護 `wiki/` 內的所有 Markdown 檔案。\n\n---\n\n## 3. 頁面格式與撰寫規範（Page Conventions）\n\n### 3.1 YAML Frontmatter 標頭\n`wiki/` 底下所有內容頁面（`index.md` 與 `log.md` 除外）**必須**包含標準 YAML Frontmatter，以便 Obsidian Dataview 與網頁端解析：\n\n```yaml\n---\ntitle: 頁面完整標題\ncategory: concepts | papers | models | comparisons | overview\ntags: [標籤1, 標籤2, 標籤3]\ncreated: YYYY-MM-DD\nupdated: YYYY-MM-DD\nsources:\n  - raw/對應原始檔名.md\nstatus: seed | developing | evergreen\n---\n```\n\n### 3.2 檔案命名與連結規範（兼顧 Obsidian 與網頁渲染）\n- **檔名規範**：一律使用小寫英文與連字號（kebab-case），例如 `muscle-hypertrophy.md`、`retrieval-augmented-generation.md`，避免空格與特殊符號。\n- **連結格式（雙軌相容）**：為了同時支援 Obsidian 圖譜檢視與 GitHub Pages 靜態網頁跳轉，引用站內其他頁面時，請優先使用**標準相對路徑 Markdown 連結**，格式為 `[顯示名稱](../資料夾/檔名.md)`（若在同層目錄則為 `[顯示名稱](檔名.md)`）。\n- **語言風格**：內文以**繁體中文**撰寫，專業術語採用「繁體中文（英文專有名詞 / 縮寫）」格式，例如：`自主力竭（Volitional Failure）`、`檢索增強生成（Retrieval-Augmented Generation, RAG）`，確保學術精確度與可讀性。\n\n### 3.3 各類頁面標準結構\n- **概念頁（`wiki/concepts/`）**：\n  1. 一句話核心定義（Callout 區塊）\n  2. 技術／生理原理與運作機制\n  3. 演進脈絡與關鍵實證發現\n  4. 優勢、限制與實務應用建議\n  5. 相關論文、比較表與延伸概念（交叉引用）\n- **論文頁（`wiki/papers/`）**：\n  1. 基本資訊（發表年份、期刊/會議、作者、原始檔案連結）\n  2. 核心問題與研究動機（解決了什麼痛點或爭議？）\n  3. 方法架構與研究設計（樣本數、分組定義、統計方法）\n  4. 實驗結果與關鍵數據（附具體統計數據如 SMD、95% CI、P 值）\n  5. 局限性與實務啟示（連結至相關概念與比較頁面）\n- **比較與分析頁（`wiki/comparisons/`）**：\n  1. 比較背景與評估維度\n  2. 結構化 Markdown 比較表\n  3. 適用場景建議與關鍵結論\n\n---\n\n## 4. 三大核心作業流程（Core Operations）\n\n### 流程一：Ingest（攝取新資料）\n當人類貼上文章、上傳檔案或要求處理新資料時，依序執行以下步驟：\n1. **原始資料歸檔**：將原文完整保存至 `raw/` 資料夾中，確保單一事實來源可追溯。\n2. **深度閱讀**：完整閱讀 `raw/` 中的目標文件，提取核心論點、方法細節、實驗數據與引用關係。\n3. **建立來源專屬頁**：在 `wiki/papers/`（若是論文）或對應分類建立該來源的精讀頁面，並填寫完整 Frontmatter。\n4. **知識融合（關鍵步驟）**：檢查既有的 `wiki/concepts/`、`wiki/models/`、`wiki/comparisons/` 與 `wiki/overview.md`，將新知識整合進去：\n   - 若涉及重要核心概念且尚未建立概念頁，主動在 `wiki/concepts/` 建立新頁面。\n   - 若涉及多組條件或方法的實證對比，在 `wiki/comparisons/` 建立或更新結構化比較表。\n   - 若新資料推翻或修正了舊頁面的說法，**必須明確標註演進與差異**（例如：`> **觀點更新（YYYY-MM-DD）**：根據 ... 的研究，...`）。\n   - 確保雙向交叉引用完整。\n5. **更新索引與日誌**：\n   - 在 `wiki/index.md` 對應分類下新增或更新條目與一句話摘要。\n   - 在 `wiki/log.md` 最末端追加一筆紀錄。\n\n### 流程二：Query（查詢與知識沉澱）\n當人類針對知識庫提問時：\n1. **先查索引**：優先讀取 `wiki/index.md` 與 `wiki/overview.md` 定位相關頁面，再深入讀取目標頁面（避免盲目全庫搜尋）。\n2. **附帶出處回答**：綜合多個頁面給出結構化回答，並附上站內頁面連結與原始資料依據。\n3. **主動沉澱（Compounding）**：若該問答產出了有價值的跨文件比較、架構整理或新洞見，主動將該分析存為 `wiki/comparisons/` 下的新頁面，並同步更新 `wiki/index.md` 與 `wiki/log.md`，讓對話探索直接轉化為永久知識資產。\n\n### 流程三：Lint（知識庫健康檢查）\n當人類要求執行健康檢查（例如：「請執行 wiki lint」）時，全面掃描 `wiki/` 並產出體檢報告：\n1. **矛盾與過時檢查**：檢查不同頁面之間是否存在相互矛盾的數據或已被新研究推翻的舊結論。\n2. **孤島頁面（Orphan Pages）**：找出沒有任何其他頁面連入（Inbound links = 0）的頁面，建議整合或補充連結。\n3. **缺漏概念偵測**：找出內文中頻繁提及、具備重要研究價值但尚未建立獨立頁面的概念，建議建立新條目。\n4. **索引與連結驗證**：確認 `wiki/index.md` 是否遺漏任何 `wiki/` 內的檔案，並檢查所有相對路徑連結是否有效。\n\n---\n\n## 5. 索引與日誌格式規範（Indexing & Logging）\n\n### `wiki/index.md` 規範\n- 作為整個知識庫的導航地圖，**同時也是 `index.html` 網頁側邊欄的自動解析來源**。\n- 每個條目必須維持統一的列表格式：\n  `- [頁面標題](分類資料夾/檔名.md) — 一句話精簡摘要（更新日期：YYYY-MM-DD）`\n- 每次新增、刪除或大幅改寫頁面時，必須同步更新 `wiki/index.md`。\n\n### `wiki/log.md` 規範\n- 採用**僅追加（Append-only）**的時間軸紀錄格式，嚴禁修改歷史紀錄。\n- 每筆紀錄標題必須嚴格遵守以下前綴格式（方便以 `grep \"^## \\[\" wiki/log.md` 解析）：\n  ```markdown\n  ## [YYYY-MM-DD] <ingest | query | lint | init> | <簡短標題>\n  - **操作說明**：簡述本次處理的原始資料或任務內容。\n  - **影響頁面**：列出新增或更新的 `wiki/` 檔案路徑。\n  ```\n", "README.md": "# 🧠 LLM Research Wiki（大型語言模型研究知識庫）\n\n本專案採用 Andrej Karpathy 提出的 **LLM Wiki** 設計模式，將 AI Coding Agent（Claude Code、Codex、Cursor 等）作為專職的知識庫維護者，把零散的論文、技術文章與研究筆記，持續編譯成結構化、高度互連的個人知識庫。\n\n## 📁 專案結構\n\n- **`AGENTS.md`**：給 AI Agent 閱讀的專案憲法與作業規範（Schema），定義目錄權責、YAML 標頭格式，以及 `Ingest`（攝取）、`Query`（查詢沉澱）、`Lint`（健康檢查）三大標準流程。\n- **`raw/`**：原始資料層（唯讀）。存放論文 Markdown、網頁剪藏與圖表素材（`raw/assets/`），AI 僅能讀取、不可修改。\n- **`wiki/`**：知識庫層（由 AI 維護）。包含內容目錄 `index.md`、操作日誌 `log.md`、領域總覽 `overview.md`，以及 `concepts/`、`papers/`、`models/`、`comparisons/` 四大分類知識頁。\n- **`index.html`**：零建置成本的靜態網頁閱讀器，可直接透過 GitHub Pages 部署瀏覽整個知識庫。\n\n## 🚀 快速開始\n\n### 1. 本機預覽網頁\n由於瀏覽器安全性限制（`fetch` 讀取本地 Markdown 檔案需要 HTTP 協定），在本機測試時請在專案根目錄啟動簡易伺服器：\n\n```bash\npython -m http.server 8000\n```\n接著開啟瀏覽器前往 `http://localhost:8000` 即可瀏覽知識庫網頁。\n\n### 2. 部署至 GitHub Pages\n1. 將本專案推送至 GitHub Repository。\n2. 進入 Repository 的 **Settings → Pages**。\n3. 在 **Build and deployment** 選擇 **Deploy from a branch**，分支選擇 `main`、資料夾選擇 `/ (root)`，點擊 Save 即可獲得公開網址。\n\n### 3. 搭配 AI Agent 擴充知識庫\n1. 將新的論文或文章存入 `raw/` 資料夾（例如 `raw/deepseek-r1.md`）。\n2. 在 AI Agent 中輸入指令：\n   > 「請依照 `AGENTS.md` 的規範，ingest `raw/deepseek-r1.md`。」\n3. AI 會自動建立論文頁、更新相關概念頁與總覽，並同步寫入 `wiki/index.md` 與 `wiki/log.md`；推送到 GitHub 後，網頁側邊欄與內容就會自動更新！\n", "wiki/index.md": "# 📚 研究知識庫總目錄（Index）\n\n本目錄由 AI Agent 根據 `AGENTS.md` 自動維護，收錄所有已編譯的知識庫頁面，同時作為網頁版側邊欄的導航結構。\n\n## 總覽與核心脈絡（Overview）\n- [研究知識庫全景總覽](overview.md) — 彙整本知識庫收錄的學術主題脈絡與最新實證研究結論（更新日期：2026-11-16）\n\n## 核心概念（Concepts）\n- [肌肥大與訓練負荷效應（Muscle Hypertrophy）](concepts/muscle-hypertrophy.md) — 整合負荷無關性（含 Type I/II 纖維）、每週組數劑量效應與離心／節奏等關鍵調節因子（更新日期：2026-11-16）\n- [最大肌力與負荷特異性（Muscle Strength & 1-RM）](concepts/muscle-strength-1rm.md) — 解析高負荷訓練（≥80% 1-RM）透過特異性原則與神經適應最大化 1-RM 肌力的機制（更新日期：2026-11-16）\n- [訓練量與訓練頻率（Training Volume & Frequency）](concepts/training-volume-and-frequency.md) — 解析每肌群每週 ≥10 組的漸進劑量效應，以及訓練頻率作為組數分配工具的角色（更新日期：2026-11-16）\n- [血流限制訓練（Blood Flow Restriction Training, BFR）](concepts/blood-flow-restriction-training.md) — 探討加壓製造局部缺氧與代謝壓力，使低負荷訓練達成等同高負荷肌肥大之機制與參數（更新日期：2026-11-16）\n- [自主力竭與運動單位徵召（Volitional Failure）](concepts/volitional-failure.md) — 依據 Henneman 尺寸原則解釋低負荷練至力竭如何徵召高閾值運動單位，及動作節奏限制（更新日期：2026-11-16）\n- [LLM Wiki 知識庫架構模式](concepts/llm-wiki-pattern.md) — 透過 AI 持續編譯與維護 Markdown 知識庫，解決傳統 RAG 每次重頭檢索、缺乏知識累積的痛點（更新日期：2026-11-16）\n- [檢索增強生成（Retrieval-Augmented Generation, RAG）](concepts/retrieval-augmented-generation.md) — 結合外部知識檢索與語言模型生成能力的經典架構，及其與持久化知識庫的互補關係（更新日期：2026-11-16）\n\n## 重要論文（Papers）\n- [Lopez et al. (2021) — 阻力訓練負荷對肌肥大與肌力增長之網絡統合分析](papers/lopez-2021-resistance-training-load.md) — 綜合 28 篇研究（747 名成人）證實肌肥大與負荷無關、最大肌力則高度依賴高負荷（更新日期：2026-11-16）\n- [Bernárdez-Vázquez et al. (2022) — 最佳化肌肥大之阻力訓練變項傘狀回顧](papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md) — 彙整 14 篇統合分析（178 篇研究）評估九大訓練變項，確立每週 ≥10 組訓練量與離心／節奏／BFR 處方原則（更新日期：2026-11-16）\n\n## 模型與架構（Models）\n- [肌肥大三大生理驅動機制模型（Three Mechanisms of Hypertrophy）](models/hypertrophy-mechanisms-model.md) — 解析機械張力、代謝壓力與肌肉損傷三大路徑如何對應不同負荷與 BFR 處方（更新日期：2026-11-16）\n\n## 橫向比較與問答沉澱（Comparisons）\n- [低、中、高負荷阻力訓練效果橫向比較表](comparisons/resistance-training-load-comparison.md) — 對照低負荷、低負荷＋BFR、中負荷與高負荷在肌肥大、肌纖維類型、肌力 SMD 與實務耐受度的差異（更新日期：2026-11-16）\n- [肌肥大九大訓練變項實證影響矩陣](comparisons/hypertrophy-training-variables-matrix.md) — 依實證影響強度分級彙整九大阻力訓練變項（訓練量、負荷、收縮模式、節奏、BFR、頻率、順序、時段、週期化）與處方口訣（更新日期：2026-11-16）\n", "wiki/log.md": "# 🕒 知識庫操作日誌（Log）\n\n本檔案採「僅追加（Append-only）」模式記錄知識庫的每一次演進，支援以 `grep \"^## \\[\" wiki/log.md` 快速檢索歷史紀錄。\n\n## [2026-11-16] init | 初始化 LLM 研究知識庫架構\n- **操作說明**：依據 Karpathy LLM Wiki 三層架構建立專案目錄、`AGENTS.md` 中文規範、GitHub Pages 網頁閱讀器 `index.html`，以及初始範例頁面。\n- **影響頁面**：`AGENTS.md`、`index.html`、`wiki/index.md`、`wiki/overview.md`、`wiki/concepts/llm-wiki-pattern.md`、`wiki/concepts/retrieval-augmented-generation.md`\n\n## [2026-11-16] ingest | Lopez et al. (2021) 阻力訓練負荷對肌肥大與肌力之統合分析\n- **操作說明**：將首篇論文 `msse-53-1206.pdf` 保存至 `raw/msse-53-1206.pdf` 與 `raw/lopez-2021-resistance-training-load.md`，並依據 `AGENTS.md` 完成論文精讀頁、三大核心概念頁與負荷比較表之編譯與交叉連結。\n- **影響頁面**：`raw/msse-53-1206.pdf`、`raw/lopez-2021-resistance-training-load.md`、`wiki/papers/lopez-2021-resistance-training-load.md`、`wiki/concepts/muscle-hypertrophy.md`、`wiki/concepts/muscle-strength-1rm.md`、`wiki/concepts/volitional-failure.md`、`wiki/comparisons/resistance-training-load-comparison.md`、`wiki/overview.md`、`wiki/index.md`\n\n## [2026-11-16] ingest | Bernárdez-Vázquez et al. (2022) 最佳化肌肥大之阻力訓練變項傘狀回顧\n- **操作說明**：將第二篇論文 `fspor-04-949021.pdf` 歸檔至 `raw/fspor-04-949021.pdf` 與 `raw/bernardez-vazquez-2022-hypertrophy-umbrella-review.md`，建立傘狀回顧精讀頁，新增「訓練量與訓練頻率」及「血流限制訓練（BFR）」兩項核心概念頁與「肌肥大九大訓練變項實證影響矩陣」，並同步融合更新既有機制概念、負荷比較表、領域總覽與總目錄。\n- **影響頁面**：`raw/fspor-04-949021.pdf`、`raw/bernardez-vazquez-2022-hypertrophy-umbrella-review.md`、`wiki/papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md`、`wiki/concepts/training-volume-and-frequency.md`、`wiki/concepts/blood-flow-restriction-training.md`、`wiki/concepts/muscle-hypertrophy.md`、`wiki/concepts/volitional-failure.md`、`wiki/comparisons/hypertrophy-training-variables-matrix.md`、`wiki/comparisons/resistance-training-load-comparison.md`、`wiki/overview.md`、`wiki/index.md`\n\n## [2026-11-16] lint | 整合第三版（v3）理論模型層與雙模式網頁閱讀器\n- **操作說明**：補齊 `wiki/models/` 空白分類（新增肌肥大三大生理驅動機制模型頁），完成全庫雙向連結與索引驗證，並升級 `index.html` 支援 GitHub Pages／HTTP Server 動態讀取與本地 `file://` 雙擊離線預覽雙模式。\n- **影響頁面**：`wiki/models/hypertrophy-mechanisms-model.md`、`wiki/overview.md`、`wiki/index.md`、`wiki/log.md`、`index.html`\n", "wiki/overview.md": "---\ntitle: 研究知識庫全景總覽（Research Overview）\ncategory: overview\ntags: [Overview, Knowledge-Base, LLM-Research, Exercise-Science]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - AGENTS.md\n  - raw/lopez-2021-resistance-training-load.md\n  - raw/bernardez-vazquez-2022-hypertrophy-umbrella-review.md\nstatus: developing\n---\n\n# 研究知識庫全景總覽（Research Overview）\n\n> **知識庫定位**：本知識庫依據 `AGENTS.md` 規範持續累積並編譯各類學術文獻與技術研究，透過「原始資料（`raw/`）$\\rightarrow$ 結構化筆記（`wiki/`）$\\rightarrow$ 交叉比較與索引」的複利流程，讓每篇新讀入的文章都與既有概念深度連結。\n\n## 1. 目前收錄研究主題脈絡\n\n### 主題一：知識庫架構與大型語言模型（LLM & Knowledge Systems）\n- **知識編譯架構**：透過 [LLM Wiki 知識庫架構模式](concepts/llm-wiki-pattern.md) 將零散文獻預編譯為持久化知識網路，與傳統的 [檢索增強生成（RAG）](concepts/retrieval-augmented-generation.md) 形成互補。\n\n### 主題二：運動科學與阻力訓練適應（Resistance Training & Exercise Physiology）\n本領域目前整合了兩篇高階統合證據，完整回答了「訓練重量如何選」與「九大訓練變項如何最佳化」兩大核心問題：\n\n1. **負荷強度對肌肥大與肌力的分化效應**（[Lopez et al., 2021 網絡統合分析](papers/lopez-2021-resistance-training-load.md)）：\n   - 當訓練執行至[自主力竭（Volitional Failure）](concepts/volitional-failure.md)時，**[肌肥大（Muscle Hypertrophy）](concepts/muscle-hypertrophy.md)**呈現「負荷無關性」，低、中、高負荷皆可達成相近增幅（且在 Type I 與 Type II 肌纖維上皆然）。\n   - **[最大肌力（1-RM Strength）](concepts/muscle-strength-1rm.md)**則呈現高度「負荷依賴性」，高負荷（$\\ge 80\\%$ 1-RM）具有 98.2% 的機率成為最佳方案。\n   - 完整劑量決策可參閱[低、中、高負荷阻力訓練效果橫向比較表](comparisons/resistance-training-load-comparison.md)。\n\n2. **最佳化肌肥大之九大訓練變項全景**（[Bernárdez-Vázquez et al., 2022 傘狀回顧](papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md)）：\n   - **[訓練量與訓練頻率](concepts/training-volume-and-frequency.md)**：**每週訓練量**是唯一與肌肥大呈明確漸進劑量效應的變項（建議每肌群每週 $\\ge 10$ 組）；訓練頻率在總量固定時無直接影響，主要用於分散組數與優化恢復。\n   - **執行細節與替代工具**：離心收縮具小幅優勢與區域互補性；單次反覆持續時間宜落在 **0.5–8 秒**（避免 $\\ge 10$ 秒超慢速）；無法承受重負荷者可採用[血流限制訓練（BFR）](concepts/blood-flow-restriction-training.md)搭配低負荷達成同等肌肥大。\n   - **彈性中性變項**：動作順序、早晚訓練時段與週期化模型（線性 vs. 波動式）在總量相同時對肌肥大無直接顯著差異，詳見[肌肥大九大訓練變項實證影響矩陣](comparisons/hypertrophy-training-variables-matrix.md)。\n\n3. **生理驅動機制整合模型**：\n   - 透過[肌肥大三大生理驅動機制模型](models/hypertrophy-mechanisms-model.md)，將「機械張力、代謝壓力、肌肉損傷」三大細胞訊號路徑與不同負荷區間及 BFR 訓練處方完整對應。\n\n## 2. 新增文獻標準流程\n\n1. 將新文章或論文貼給 AI 並存檔至 `raw/` 資料夾（確保單一事實來源不可變動）。\n2. AI 依 `AGENTS.md` 自動建立 `wiki/papers/` 精讀頁、提取或更新 `wiki/concepts/` 核心概念，並同步更新 `wiki/index.md` 與 `wiki/log.md`。\n", "wiki/papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md": "---\ntitle: Bernárdez-Vázquez et al. (2022) — 最佳化肌肥大之阻力訓練變項傘狀回顧\ncategory: papers\ntags: [Resistance-Training, Muscle-Hypertrophy, Umbrella-Review, Training-Volume, Blood-Flow-Restriction]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - raw/bernardez-vazquez-2022-hypertrophy-umbrella-review.md\n  - raw/fspor-04-949021.pdf\nstatus: evergreen\n---\n\n# Bernárdez-Vázquez et al. (2022) — 最佳化肌肥大之阻力訓練變項傘狀回顧\n\n> **核心結論**：在檢視 14 篇統合分析（涵蓋 178 篇原始研究、逾 4,700 名受試者）後，**每週訓練量（Volume）是唯一與肌肥大呈現明確劑量效應（Dose-Response）的變項**（建議每肌群每週至少 10 組）；此外，**離心收縮（Eccentric Contractions）**具小幅優勢、應**避免單次反覆 $\\ge 10$ 秒的超慢速動作**，且**血流限制訓練（BFR）**對無法承受大重量者極具價值。相對地，**動作順序、訓練時段與週期化模型**對肌肥大增幅無顯著直接影響。\n\n## 1. 基本資訊\n\n- **論文標題**：Resistance Training Variables for Optimization of Muscle Hypertrophy: An Umbrella Review\n- **作者團隊**：Roberto Bernárdez-Vázquez, Javier Raya-González, Daniel Castillo, Marco Beato\n- **發表期刊與年份**：*Frontiers in Sports and Active Living*, Vol. 4, Article 949021（2022）\n- **DOI**：`10.3389/fspor.2022.949021`\n- **原始檔案**：[Markdown 全文存檔](../../raw/bernardez-vazquez-2022-hypertrophy-umbrella-review.md) ｜ [原始 PDF 檔案](../../raw/fspor-04-949021.pdf)\n\n## 2. 核心問題與研究動機\n\n1. **訓練變項缺乏整合共識**：阻力訓練誘導[肌肥大（Muscle Hypertrophy）](../concepts/muscle-hypertrophy.md)仰賴機械張力（Mechanical Stress）、代謝壓力（Metabolic Stress）與肌肉損傷（Muscle Damage）三大機制，但實務處方涉及組數、頻率、負荷強度、收縮模式、動作節奏、動作順序、訓練時段、週期化與血流限制等九大變項，過去缺乏將高階統合分析證據彙整為單一實務指南的**傘狀回顧（Umbrella Review）**。\n2. **為運動表現與臨床健康提供處方依據**：肌肉橫截面積（CSA）與最大肌力、發力率（RFD）及爆發力高度正相關，同時能改善胰島素敏感性、血糖控制與肌肉減少症（Sarcopenia）風險，因此亟需系統性評估各訓練變項的證據等級與方法學品質。\n\n## 3. 方法架構與品質評估\n\n- **檢索與納入標準（PICO）**：遵循 PRISMA 與 Aromataris 等人傘狀回顧規範，檢索 PubMed/MEDLINE、SPORTDiscus 與 Web of Science（截至 2021 年 11 月 27 日）。僅納入針對健康且具身體活動習慣之成年人、使用傳統自由重量或機械式器材、並以肌肉量／橫截面積（CSA）／肌厚度／去脂體重（FFM）為指標之英文統合分析（排除兒童與高齡族群專項研究）。\n- **納入規模**：自 57 筆檢索紀錄中篩選出 **14 篇統合分析**（發表於 2009–2020 年），涵蓋 **178 篇原始研究**（摘要載明 4,784 名受試者，內文結果段統計為 4,704 名）。\n- **方法學與證據品質評估**：\n  - **AMSTAR 2 方法學品質**：依 Table 2 評分，8 篇統合分析達**高品質（81%，滿足 13/16 項指標）**（Schoenfeld et al., 2015, 2017a, 2017c, 2019a; Nunes et al., 2020; Grgic et al., 2017, 2019; Lixandrão et al., 2018），其餘 6 篇為**中等品質（63–75%）**（Krieger, 2010; Schoenfeld et al., 2016a, 2017b; Grgic, 2020; Roig et al., 2009; Slysz et al., 2016）。\n  - **GRADE 證據等級**：8 篇具備高品質原始研究基礎（High GRADE），另 6 篇因未報告原始研究品質評估而列為「無系統性回顧證據等級資訊（NEFSR）」。\n\n## 4. 九大訓練變項實證結果與關鍵數據\n\n| 訓練變項 | 納入統合分析（研究數／樣本數） | 核心實證發現與統計結論 |\n| :--- | :--- | :--- |\n| **1. 訓練量（Volume / Sets）** | Krieger (2010) [8 篇, $N=322$]<br>Schoenfeld et al. (2017a) [15 篇, $N=390$] | **唯一具明確漸進劑量效應的變項**：多組訓練（2–3 組）較單組增加 **40% 肌肥大**；每肌群每週 $\\le 4$ 組即可產生顯著增長，但**每週 $\\ge 10$ 組**可最大化肌肥大（超過特定上限則蛋白質合成趨於高原並增加過度訓練風險）。 |\n| **2. 訓練頻率（Frequency）** | Schoenfeld et al. (2019a) [25 篇, $N=836$, $I^2=0\\%$] | **總訓練量相等時無顯著影響**；但當總訓練量未固定時，較高頻率有助於累積更多每週組數並維持組間恢復品質，進而帶來更大肌肥大。 |\n| **3. 訓練強度（Intensity / Load）** | Schoenfeld et al. (2016a) [8 篇, $N=191$]<br>Schoenfeld et al. (2017c) [10 篇, $N=630$]<br>Grgic (2020) [10 篇, $N=120$, $I^2=0\\text{–}18\\%$] | **練至力竭時低負荷（$<60\\%$ 1-RM）與高負荷（$\\ge 65\\%$ 1-RM）肌肥大效果相近**，且在 **Type I 與 Type II 肌纖維**上均無顯著差異（儘管 2016a 顯示高負荷有邊緣優勢趨勢 $P=0.076$，且低負荷不適感較高）。 |\n| **4. 收縮模式（Contraction Type）** | Roig et al. (2009) [20 篇, $N=678$, $I^2=65\\%$]<br>Schoenfeld et al. (2017b) [15 篇, $N=356$] | 離心與向心訓練皆有效，但**離心訓練具小幅優勢（10% vs. 6.8%）**；向心主要刺激**肌腹中段**，離心則對**遠端肌纖維**與 **Type II 快縮肌纖維**刺激更強，建議結合兩種收縮模式。 |\n| **5. 反覆持續時間（Repetition Duration）** | Schoenfeld et al. (2015) [8 篇, $N=239$] | 練至向心力竭時，單次反覆 **0.5 至 8 秒**皆可產生相近肌肥大；但**刻意超慢速（$\\ge 10$ 秒／次）效果顯著較差**，主因是速度過慢導致無法有效徵召高閾值運動單位。 |\n| **6. 動作順序（Exercise Order）** | Nunes et al. (2020) [11 篇, $N=268$, $I^2=0\\%$] | 多關節優先或單關節優先**對整體肌肥大無顯著影響**（惟部分超音波測量集中於協同肌而非主動肌，實務可依個人偏好或欲優先強化之肌群安排）。 |\n| **7. 訓練時段（Time of Day）** | Grgic et al. (2019) [6 篇, $N=221$, $I^2=0\\%$] | 儘管神經肌肉峰值表現約在傍晚 18:00（Acrophase），但**早晨與傍晚訓練的長期肌肥大效果無顯著差異**（運動後 p70S6K 磷酸化反應相近）。 |\n| **8. 週期化模式（Periodization）** | Grgic et al. (2017) [13 篇, $N=303$] | **在總訓練量相同的前提下，線性週期化（LP）與每日波動式週期化（DUP）肌肥大效果相近**；只要維持漸進式超負荷與足夠訓練量，週期化形式可依個人動機與依從性選擇。 |\n| **9. 血流限制（Blood Flow Restriction, BFR）** | Slysz et al. (2016) [19 篇, $N=377$]<br>Lixandrão et al. (2018) [10 篇, $N=222$] | 動態訓練結合 BFR（尤其持續 $\\ge 8$ 週、壓脈帶壓力 $>150\\text{ mmHg}$）可顯著增強肌肉尺寸；**低負荷＋BFR 可達成與傳統高負荷相當的肌肥大**，且低閉塞壓較舒適，適合受傷復健或無法承受大重量族群。 |\n\n## 5. 局限性與實務處方建議\n\n- **方法學局限**：\n  1. 14 篇統合分析中有 6 篇未報告原始研究品質（GRADE 評估缺漏），且多數原始研究受試者為無訓練經驗之年輕成人，對高階運動員的外推需謹慎。\n  2. 訓練量上限（高原期閾值）、不同解剖區域之局部肌肥大測量敏感度，以及不同時型（Chronotype）對早晚訓練的個別反應仍需進一步研究。\n- **實務訓練處方九大原則**：\n  1. **訓練量**：每個動作安排 **2–3 組**，並確保**每個肌群每週累積至少 10 組**（詳見[訓練量與訓練頻率](../concepts/training-volume-and-frequency.md)）。\n  2. **訓練頻率**：將每週訓練頻率作為分配總組數與維持恢復品質的工具。\n  3. **負荷強度**：兼顧 $<60\\%$ 與 $>60\\%$ 1-RM 的負荷變化並訓練至接近力竭（若兼顧最大肌力則優先高負荷，詳見 [Lopez et al., 2021](lopez-2021-resistance-training-load.md)）。\n  4. **收縮模式**：同時涵蓋向心與離心收縮（必要時可善用飛輪等離心超負荷器材）。\n  5. **動作節奏**：單次反覆控制在 **0.5–8 秒**之間，**嚴格避免 $\\ge 10$ 秒的超慢速動作**。\n  6. **動作順序、訓練時段與週期化**：依個人偏好、作息與心理依從性彈性配置，核心前提是守住每週總訓練量與漸進式超負荷。\n  7. **血流限制（BFR）**：針對傷後復健、關節不適或無法承受高機械負荷者，採用[血流限制訓練（BFR）](../concepts/blood-flow-restriction-training.md)搭配低負荷即可獲得完整肌肥大效益。\n\n## 6. 相關概念與延伸頁面\n\n- 姊妹論文：[Lopez et al. (2021) — 阻力訓練負荷對肌肥大與肌力增長之網絡統合分析](lopez-2021-resistance-training-load.md)\n- 核心概念：[肌肥大與訓練負荷效應（Muscle Hypertrophy）](../concepts/muscle-hypertrophy.md)\n- 新增概念：[訓練量與訓練頻率（Training Volume & Frequency）](../concepts/training-volume-and-frequency.md)\n- 新增概念：[血流限制訓練（Blood Flow Restriction Training, BFR）](../concepts/blood-flow-restriction-training.md)\n- 橫向比較：[肌肥大九大訓練變項實證影響矩陣](../comparisons/hypertrophy-training-variables-matrix.md)\n", "wiki/papers/lopez-2021-resistance-training-load.md": "---\ntitle: Lopez et al. (2021) — 阻力訓練負荷對肌肥大與肌力增長之系統性回顧與網絡統合分析\ncategory: papers\ntags: [Resistance-Training, Muscle-Hypertrophy, Muscle-Strength, Network-Meta-Analysis, Volitional-Failure]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - raw/lopez-2021-resistance-training-load.md\n  - raw/msse-53-1206.pdf\nstatus: evergreen\n---\n\n# Lopez et al. (2021) — 阻力訓練負荷對肌肥大與肌力增長之系統性回顧與網絡統合分析\n\n> **核心結論**：當阻力訓練執行至**自主力竭（Volitional Failure）**時，低、中、高三種負荷產生的**肌肥大（Muscle Hypertrophy）效果並無顯著差異**（負荷無關性）；然而，**最大肌力（1-RM Strength）的提升則高度依賴高負荷訓練**（$\\ge 80\\%$ 1-RM 勝出機率高達 98.2%）。\n\n## 1. 基本資訊\n\n- **論文標題**：Resistance Training Load Effects on Muscle Hypertrophy and Strength Gain: Systematic Review and Network Meta-analysis\n- **作者團隊**：Pedro Lopez, Régis Radaelli, Dennis R. Taaffe, Robert U. Newton, Daniel A. Galvão, Gabriel S. Trajano, Juliana L. Teodoro, William J. Kraemer, Keijo Häkkinen, Ronei S. Pinto\n- **發表期刊與年份**：*Medicine & Science in Sports & Exercise (MSSE)*, Vol. 53, No. 6, pp. 1206–1216（2021）\n- **原始檔案**：[Markdown 全文存檔](../../raw/lopez-2021-resistance-training-load.md) ｜ [原始 PDF 檔案](../../raw/msse-53-1206.pdf)\n\n## 2. 核心問題與研究動機\n\n1. **負荷選擇的長期爭議**：根據 Henneman 尺寸原則（Size Principle），運動單位由小到大依序徵召。傳統觀點認為必須使用高負荷才能徵召高閾值運動單位，但近年研究顯示低負荷練至[自主力竭（Volitional Failure）](../concepts/volitional-failure.md)亦可透過神經肌肉疲勞達到類似的肌肥大效果。\n2. **既有統合分析的缺口**：過去統合分析多僅做「低負荷（$\\le 60\\%$ 1-RM）vs. 高負荷（$>60\\%$ 1-RM）」的二元比較，缺乏透過**網絡統合分析（Network Meta-Analysis）**同時評估「低、中、高」三種明確負荷區間，並探討訓練經驗、總訓練次數、性別等共變項（Covariates）的調節作用。\n\n## 3. 方法架構與研究設計\n\n- **納入標準**：健康成年人、每組訓練執行至[自主力竭](../concepts/volitional-failure.md)、介入期 $\\ge 6$ 週、比較不同阻力負荷對肌肉量／截面積或 1-RM 肌力的影響（排除[血流限制訓練 BFR](../concepts/blood-flow-restriction-training.md)）。\n- **負荷區間定義**：\n  - **低負荷（Low-load RT）**：$<60\\%$ 1-RM 或 $>15$ RM\n  - **中負荷（Moderate-load RT）**：$60\\%\\text{–}79\\%$ 1-RM 或 $9\\text{–}15$ RM\n  - **高負荷（High-load RT）**：$\\ge 80\\%$ 1-RM 或 $\\le 8$ RM\n- **納入樣本規模**：\n  - 共納入 **28 篇隨機對照／實驗研究**，涵蓋 **747 名健康成人**（平均年齡 $23.4 \\pm 3.0$ 歲；男性佔 67.9%；無訓練經驗者佔 75.0%，休閒訓練者 25.0%，無菁英力量選手）。\n  - 平均介入週數為 $8.9 \\pm 2.1$ 週，平均總訓練次數為 $24.6 \\pm 7.5$ 次（範圍 16–48 次）。\n  - **肌肥大分析**：24 篇研究（35 項比較）；**肌力分析**：23 篇研究（39 項比較）。\n\n## 4. 實驗結果與關鍵數據\n\n### 4.1 肌肥大效果（Muscle Hypertrophy — 負荷無關）\n在整體分析（$I^2 = 0\\%$）與高品質子群分析（$I^2 = 0\\%$）中，三種負荷之間**皆無統計顯著差異**：\n- **高負荷 vs. 低負荷**：整體 $\\text{SMD} = 0.12$（95% CI: $-0.06$ 至 $0.29$，$P = 0.241$）；高品質研究 $\\text{SMD} = 0.10$（$P = 0.871$）。\n- **中負荷 vs. 低負荷**：整體 $\\text{SMD} = 0.20$（95% CI: $-0.04$ 至 $0.44$，$P = 0.113$）；高品質研究 $\\text{SMD} = -0.06$（$P = 0.929$）。\n- **高負荷 vs. 中負荷**：整體 $\\text{SMD} = -0.09$（95% CI: $-0.33$ 至 $0.16$，$P = 0.469$）；高品質研究 $\\text{SMD} = 0.15$（$P = 0.995$）。\n- **網絡統合迴歸（Meta-regression）關鍵調節因子**：\n  - **訓練經驗（Training Status）**：無訓練經驗者（Untrained）在低 vs. 高負荷比較中展現顯著更高的肌肥大反應（$P = 0.033$），符合適應邊際效益遞減原則。\n  - **總訓練次數（Number of Sessions）**：在中 vs. 低（$P = 0.031$）與高 vs. 中（$P = 0.045$）比較中，**較多的訓練次數顯著帶來更大的肌肥大效果**，對已有訓練經驗者尤為關鍵（與[訓練量與訓練頻率](../concepts/training-volume-and-frequency.md)之劑量效應一致）。\n\n### 4.2 最大肌力效果（1-RM Strength — 負荷依賴）\n剔除極端離群值（Anderson & Kearney, 1982）後，高負荷與中負荷均顯著優於低負荷：\n- **高負荷 vs. 低負荷**：整體 $\\text{SMD} = 0.60$（95% CI: $0.38$ 至 $0.82$，$P < 0.001$）；高品質研究 $\\text{SMD} = 0.63$（95% CI: $0.38$ 至 $0.88$，$P < 0.001$），屬中等正向效果量。\n- **中負荷 vs. 低負荷**：整體 $\\text{SMD} = 0.34$（95% CI: $0.05$ 至 $0.62$，$P = 0.003$）；高品質研究 $\\text{SMD} = 0.35$（95% CI: $0.05$ 至 $0.65$，$P = 0.002$），屬小幅正向效果量。\n- **高負荷 vs. 中負荷**：整體 $\\text{SMD} = 0.26$（95% CI: $-0.02$ 至 $0.54$，$P = 0.068$）；高品質研究 $\\text{SMD} = 0.28$（$P = 0.066$），呈邊緣顯著趨勢偏向高負荷。\n- **最佳介入機率**：**高負荷訓練有 98.2% 的機率成為提升最大肌力的最佳方案**。\n\n## 5. 局限性與實務啟示\n\n- **研究局限**：\n  1. 多數納入研究在隨機分配隱藏（Allocation Concealment）與肌力測試者盲法上存在偏差風險（Some Concerns 佔 87%）。\n  2. 介入週期偏短（6–14 週，平均 8.9 週），且受試者多為年輕成人（約 23.4 歲），無法直接外推至長期訓練週期或菁英力量運動員。\n  3. 僅評估動態 1-RM 肌力，未納入等長收縮（Isometric）或等速（Isokinetic）肌力測試。\n- **實務應用建議**：\n  - 若目標為**在較短時間內同時最大化肌力與肌肥大**，優先採用**高負荷（$\\ge 80\\%$ 1-RM，$\\le 8$ RM）**。\n  - 若受試者無法承受高負荷關節壓力或技術門檻，**中負荷（$60\\%\\text{–}79\\%$ 1-RM，$9\\text{–}15$ RM）**是極佳替代方案，兼具良好肌肥大效益與優於低負荷的肌力增長，同時避免低負荷練至力竭帶來的高度不適感與冗長訓練時間。\n\n## 6. 相關概念與延伸頁面\n\n- 姊妹論文：[Bernárdez-Vázquez et al. (2022) — 最佳化肌肥大之阻力訓練變項傘狀回顧](bernardez-vazquez-2022-hypertrophy-umbrella-review.md)\n- 核心概念：[肌肥大與訓練負荷效應（Muscle Hypertrophy）](../concepts/muscle-hypertrophy.md)\n- 核心概念：[最大肌力與負荷特異性（Muscle Strength & 1-RM）](../concepts/muscle-strength-1rm.md)\n- 核心概念：[自主力竭與運動單位徵召（Volitional Failure）](../concepts/volitional-failure.md)\n- 橫向比較：[低、中、高負荷阻力訓練效果比較表](../comparisons/resistance-training-load-comparison.md)\n", "wiki/comparisons/hypertrophy-training-variables-matrix.md": "---\ntitle: 肌肥大九大訓練變項實證影響矩陣\ncategory: comparisons\ntags: [Muscle-Hypertrophy, Program-Design, Umbrella-Review, Comparison, Resistance-Training]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - raw/bernardez-vazquez-2022-hypertrophy-umbrella-review.md\n  - raw/lopez-2021-resistance-training-load.md\nstatus: evergreen\n---\n\n# 肌肥大九大訓練變項實證影響矩陣\n\n> **矩陣定位**：綜合 [Bernárdez-Vázquez et al. (2022)](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md)（14 篇統合分析、178 篇原始研究）與 [Lopez et al. (2021)](../papers/lopez-2021-resistance-training-load.md)（28 篇研究網絡統合分析），將阻力訓練的九大處方變項依「對肌肥大的影響強度」分級，協助快速制定實證課表。\n\n## 1. 九大訓練變項影響力分級對照表\n\n| 影響層級 | 訓練變項 | 實證影響結論 | 關鍵量化指標與條件 | 實務處方建議 |\n| :--- | :--- | :--- | :--- | :--- |\n| **一、核心決定因子** | **[訓練量（Volume）](../concepts/training-volume-and-frequency.md)** | **強正向劑量效應**（唯一具明確劑量曲線變項） | 2–3 組較 1 組高 **40%**；每週 $\\le 4$ 組即有效，**$\\ge 10$ 組／肌群／週**最佳 | 每動作 2–3 組，確保**每肌群每週 $\\ge 10$ 組**；進階者可逐步增加總組數與課次，但留意高原期。 |\n| **二、條件調節因子** | **[訓練強度／負荷（Intensity）](resistance-training-load-comparison.md)** | **肌肥大負荷無關**（練至力竭時），但影響肌力與不適度 | $<60\\%$ 與 $\\ge 60\\%$ 1-RM 肌肥大無顯著差（含 Type I/II 纖維）；高負荷 1-RM 最佳機率 **98.2%** | 兼顧不同負荷區間並訓練至接近力竭；欲同步最大化肌力與效率者首選 **$\\ge 80\\%$ 1-RM** 或 **60–79% 1-RM**。 |\n| **二、條件調節因子** | **收縮模式（Contraction Type）** | **離心具小幅優勢**，且具區域與纖維特異性 | 離心 **10%** vs. 向心 **6.8%**；向心偏肌腹中段，離心偏遠端與 Type II 纖維 | 同時結合向心與離心收縮（完整控制離心下放階段，或輔以飛輪離心訓練）。 |\n| **二、條件調節因子** | **[反覆持續時間（Tempo）](../concepts/volitional-failure.md)** | **寬容區間內無差異，超慢速有害** | **0.5–8 秒／次**效果相近；**$\\ge 10$ 秒／次**顯著較差 | 單次反覆維持在 **0.5–8 秒**（如 1–2 秒向心、2–4 秒離心），**避免 $\\ge 10$ 秒超慢速動作**。 |\n| **二、條件調節因子** | **[血流限制（BFR）](../concepts/blood-flow-restriction-training.md)** | **低負荷增效顯著**，可替代傳統重訓 | 介入 **$\\ge 8$ 週**、壓力 **$>150\\text{ mmHg}$**；低負荷＋BFR 肌肥大等同高負荷 | 推薦用於傷後復健、關節不適或無法承受大重量族群，採用舒適之低閉塞壓即可。 |\n| **三、中性／彈性變項** | **[訓練頻率（Frequency）](../concepts/training-volume-and-frequency.md)** | **總量相等時無直接影響**（$I^2=0\\%$） | 總量未固定時高頻率較佳（因累積更多組數） | 作為**分配每週組數**的工具（如每肌群每週練 2–3 次以維持單次動作品質與恢復）。 |\n| **三、中性／彈性變項** | **動作順序（Exercise Order）** | **無顯著直接影響**（$I^2=0\\%$） | 多關節優先 vs. 單關節優先肌肥大結果相近 | 依個人偏好安排，或將**最想優先發展的目標肌群動作**排在訓練最前段。 |\n| **三、中性／彈性變項** | **訓練時段（Time of Day）** | **早晚長期效果無差異**（$I^2=0\\%$） | 傍晚 18:00 肌力峰值較高，但早晚 p70S6K 訊號與肌肥大相同 | 依個人作息、時型（Chronotype）與能長期穩定執行的時段決定。 |\n| **三、中性／彈性變項** | **週期化模式（Periodization）** | **總量相等時模型間無差異** | 線性（LP）與每日波動式（DUP）肌肥大效果相近 | 守住「每週總組數＋漸進式超負荷」前提下，依個人訓練樂趣與目標追蹤偏好選擇。 |\n\n## 2. 課表設計優先級口訣（從大石頭到小石子）\n\n1. **第一優先（決定 80% 成效）**：確保**每肌群每週 $\\ge 10$ 組有效訓練**，每組訓練至**接近[自主力竭](../concepts/volitional-failure.md)**，並維持長期漸進式超負荷。\n2. **第二優先（動作執行品質）**：完整包含**向心與離心收縮**，單次反覆節奏落在 **0.5–8 秒**（切忌 $\\ge 10$ 秒超慢速），並依肌力需求與關節耐受度選擇高／中負荷或[血流限制訓練（BFR）](../concepts/blood-flow-restriction-training.md)。\n3. **第三優先（個人化微調）**：訓練頻率、動作順序、早晚時段與週期化模型，皆以**最大化恢復品質與長期心理依從性**為最高指導原則。\n\n## 3. 相關頁面\n\n- 論文精讀：[Bernárdez-Vázquez et al. (2022) 傘狀回顧](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md) ｜ [Lopez et al. (2021) 網絡統合分析](../papers/lopez-2021-resistance-training-load.md)\n- 負荷比較：[低、中、高負荷阻力訓練效果橫向比較表](resistance-training-load-comparison.md)\n", "wiki/comparisons/resistance-training-load-comparison.md": "---\ntitle: 低、中、高負荷阻力訓練效果橫向比較表\ncategory: comparisons\ntags: [Resistance-Training, Comparison, Muscle-Hypertrophy, Muscle-Strength, Program-Design]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - raw/lopez-2021-resistance-training-load.md\n  - raw/bernardez-vazquez-2022-hypertrophy-umbrella-review.md\nstatus: evergreen\n---\n\n# 低、中、高負荷阻力訓練效果橫向比較表\n\n> **比較基準**：本表綜合 [Lopez et al. (2021)](../papers/lopez-2021-resistance-training-load.md) 網絡統合分析（28 項研究、747 名成人）與 [Bernárdez-Vázquez et al. (2022)](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md) 傘狀回顧（含肌纖維類型與[血流限制訓練 BFR](../concepts/blood-flow-restriction-training.md) 統合證據），比較不同阻力訓練負荷方案的適應與實務權衡。\n\n## 1. 各負荷方案核心指標對照\n\n| 評估維度 | 低負荷訓練（Low-Load RT） | 低負荷＋血流限制（Low-Load + BFR） | 中負荷訓練（Moderate-Load RT） | 高負荷訓練（High-Load RT） |\n| :--- | :--- | :--- | :--- | :--- |\n| **強度與反覆次數定義** | $<60\\%$ 1-RM（$>15$ RM，練至力竭） | $20\\%\\text{–}30\\%$ 1-RM 搭配加壓壓脈帶（$>150\\text{ mmHg}$） | $60\\%\\text{–}79\\%$ 1-RM（$9\\text{–}15$ RM） | $\\ge 80\\%$ 1-RM（$\\le 8$ RM） |\n| **肌肥大效果（整體）** | **有效**（與中高負荷無顯著差） | **有效**（與高負荷無顯著差，Lixandrão et al., 2018） | **有效**（與高低負荷無顯著差） | **有效**（與低中負荷無顯著差） |\n| **Type I / Type II 肌纖維肥大** | 練至力竭時兩型纖維皆有效（Grgic, 2020） | 有效（未來研究關注對 Type I 偏好） | 兩型纖維皆有效 | 兩型纖維皆有效（與低負荷無顯著差） |\n| **肌肥大效果量（vs. 低負荷）** | 基準組（Reference） | 與高負荷相當 | $\\text{SMD} = 0.20$（$P = 0.113$） | $\\text{SMD} = 0.12$（$P = 0.241$） |\n| **最大肌力提升（1-RM Strength）** | 較弱（顯著低於中、高負荷） | 優於純低負荷，但通常仍低於傳統高負荷 | **良好**（顯著優於低負荷，$\\text{SMD}=0.34, P=0.003$） | **最佳**（$\\text{SMD}=0.60, P<0.001$，最佳機率 **98.2%**） |\n| **主觀不適感與訓練耗時** | **高**（需極多反覆至力竭、張力時間長、不適感高） | **可控**（低閉塞壓下較舒適，且反覆次數大幅減少） | **適中**（耐受度與時間效率平衡） | **時間效率高**（反覆次數少，但關節與技術負荷較高） |\n| **主要生理驅動機制** | 疲勞累積後徵召高閾值運動單位 | 局部缺氧＋高度代謝壓力提早徵召快縮纖維 | 機械張力與代謝壓力兼備 | 高機械張力＋強神經系統適應＋動作特異性 |\n\n## 2. 族群與訓練目標選用建議\n\n1. **追求時間效率與「肌力＋肌肥大」雙重最大化**：\n   - 首選**高負荷訓練（$\\ge 80\\%$ 1-RM，$\\le 8$ RM）**，可在較短訓練時間內同時獲得最佳 1-RM 肌力與同等肌肥大效益。\n2. **初學者、一般健身者或追求耐受度平衡者**：\n   - 推薦**中負荷訓練（$60\\%\\text{–}79\\%$ 1-RM，$9\\text{–}15$ RM）**，並可適度穿插 $<60\\%$ 與 $>60\\%$ 1-RM 變化，在可控風險下獲得完整肌肥大與良好肌力增長。\n3. **傷後復健、關節不適或無法承受大重量負荷者**：\n   - 推薦**低負荷＋[血流限制訓練（BFR）](../concepts/blood-flow-restriction-training.md)**（持續 $\\ge 8$ 週、採用較舒適之閉塞壓），無需高機械負荷即可獲得等同重訓的肌肥大保護效果。\n4. **已有訓練經驗者（2–7 年）突破肌肥大瓶頸**：\n   - 無論採用何種負荷，應優先確保**每肌群每週至少 10 組**並適度增加總訓練課次（詳見[訓練量與訓練頻率](../concepts/training-volume-and-frequency.md)），以克服適應的邊際效益遞減。\n\n## 3. 相關頁面\n\n- 論文精讀：[Lopez et al. (2021) 網絡統合分析](../papers/lopez-2021-resistance-training-load.md) ｜ [Bernárdez-Vázquez et al. (2022) 傘狀回顧](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md)\n- 相關概念：[肌肥大與訓練負荷效應](../concepts/muscle-hypertrophy.md) ｜ [最大肌力與負荷特異性](../concepts/muscle-strength-1rm.md) ｜ [訓練量與訓練頻率](../concepts/training-volume-and-frequency.md) ｜ [血流限制訓練（BFR）](../concepts/blood-flow-restriction-training.md)\n- 變項總覽：[肌肥大九大訓練變項實證影響矩陣](hypertrophy-training-variables-matrix.md)\n", "wiki/concepts/blood-flow-restriction-training.md": "---\ntitle: 血流限制訓練（Blood Flow Restriction Training, BFR）\ncategory: concepts\ntags: [Blood-Flow-Restriction, BFR, Low-Load-Training, Metabolic-Stress, Rehabilitation]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - raw/bernardez-vazquez-2022-hypertrophy-umbrella-review.md\n  - raw/lopez-2021-resistance-training-load.md\nstatus: evergreen\n---\n\n# 血流限制訓練（Blood Flow Restriction Training, BFR）\n\n> **一句話定義**：在肢體近端穿戴加壓壓脈帶（Cuff）或止血帶以限制靜脈回流並部分減少動脈血流的阻力訓練方法；透過製造局部缺氧與高度代謝壓力，使**低負荷訓練（20–30% 1-RM）即可達成與傳統高負荷訓練相當的[肌肥大](muscle-hypertrophy.md)效果**。\n\n## 1. 生理機制：為何低重量加壓能長肌肉？\n\n傳統重訓需仰賴高外部負荷產生高機械張力以徵召快縮肌纖維（Type II）；**血流限制訓練（BFR）**則透過外部機械加壓改變局部血流動力學：\n1. **代謝產物堆積與局部缺氧**：靜脈回流受阻使乳酸、氫離子（$\\text{H}^+$）與無機磷酸鹽快速累積，形成強烈的**代謝壓力（Metabolic Stress）**與細胞腫脹（Cell Swelling）。\n2. **提早徵召高閾值運動單位**：根據 Henneman 尺寸原則，缺氧環境會加速慢縮肌纖維（Type I）疲勞，迫使神經系統在極輕負荷下提早徵召高閾值快縮運動單位，進而啟動合成代謝訊號。\n\n## 2. 關鍵實證發現與參數設定\n\n根據 [Bernárdez-Vázquez et al. (2022)](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md) 納入的兩項統合分析：\n\n1. **增幅效果與介入條件（Slysz et al., 2016；19 篇研究，$N=377$）**：\n   - 在動態阻力運動中加入 BFR 能顯著放大肌肉橫截面積與圍度增長，尤其當**訓練週期持續至少 8 週（$\\ge 8$ weeks）**且**壓脈帶壓力 $>150\\text{ mmHg}$** 時效果最為顯著。\n2. **低負荷＋BFR 等同傳統高負荷訓練（Lixandrão et al., 2018；10 篇研究，$N=222$）**：\n   - **低負荷阻力訓練結合 BFR 所誘導的肌肥大增幅，與傳統高負荷阻力訓練無顯著差異**。\n   - **壓力與寬度的實務權衡**：雖然壓脈帶寬度會影響實際動脈閉塞壓，但肌肥大效果對「絕對閉塞壓力值」與「壓脈帶寬度」具有高度獨立性；然而，**較高的閉塞壓力會顯著提高主觀費力程度（RPE）與不適感**，因此採用**較低閉塞壓力**不僅更舒適、耐受度更高，也能獲得同等的肌肥大效益。\n\n## 3. 與傳統低負荷練至力竭的互補定位\n\n在 [Lopez et al. (2021)](../papers/lopez-2021-resistance-training-load.md) 的網絡統合分析中（該研究排除了 BFR 方案），純低負荷訓練（$<60\\%$ 1-RM）必須每組執行極多反覆次數直至[自主力竭](volitional-failure.md)才能達到同等肌肥大，常伴隨冗長耗時與高度疲勞。**BFR 則大幅縮短了低負荷達到高閾值徵召所需的反覆次數與機械總量**，在關節承受極低機械應力的前提下實現高效肌肥大。\n\n## 4. 適用族群與注意事項\n\n- **最佳適用對象**：\n  - 術後或運動傷害復健期、無法承受大重量機械張力的運動員。\n  - 關節退化、肌少症或對高負荷耐受度較低的臨床與一般族群。\n  - 作為高階訓練者週期化減載期（Deload）或補充局部肌群訓練量的輔助工具。\n- **使用注意**：需使用專業可調壓壓脈帶並避免過度阻斷動脈血流，心血管疾病或血栓高風險族群使用前應經醫療評估。\n\n## 5. 相關頁面\n\n- 實證來源：[Bernárdez-Vázquez et al. (2022) 傘狀回顧](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md)\n- 相關概念：[肌肥大與訓練負荷效應（Muscle Hypertrophy）](muscle-hypertrophy.md) ｜ [自主力竭與運動單位徵召（Volitional Failure）](volitional-failure.md)\n- 橫向比較：[低、中、高負荷阻力訓練效果橫向比較表](../comparisons/resistance-training-load-comparison.md) ｜ [肌肥大九大訓練變項實證影響矩陣](../comparisons/hypertrophy-training-variables-matrix.md)\n", "wiki/concepts/llm-wiki-pattern.md": "---\ntitle: LLM Wiki 知識庫架構模式\ncategory: concepts\ntags: [Knowledge-Management, LLM-Agent, Workflow, Memex]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - AGENTS.md\nstatus: evergreen\n---\n\n# LLM Wiki 知識庫架構模式\n\n> **一句話定義**：一種讓 LLM Agent 持續編譯、交叉引用並維護結構化 Markdown 知識庫的設計模式，使個人研究知識能隨時間產生複利累積（Compounding），而非每次查詢都重新檢索拼接。\n\n## 1. 為什麼需要 LLM Wiki？\n\n傳統文件問答系統（如一般檔案上傳或基礎 [檢索增強生成（RAG）](retrieval-augmented-generation.md)）屬於「查詢時臨時拼裝」：每次提問時，模型都必須從原始文件中重新搜尋片段並推導結論，對話結束後洞見便隨之消散。\n\n**LLM Wiki** 將知識處理提前至「攝取階段（Ingest）」：\n- **知識預編譯**：每加入一份新文獻，AI 便主動更新概念頁、修正舊假設並建立交叉引用。\n- **零維護負擔**：人類專注於策展資料（Sourcing）與提出好問題，AI 承擔所有繁瑣的摘要、分類與連結維護工作。\n\n## 2. 三層系統架構\n\n1. **原始資料層（`raw/`）**：不可變動的原始文獻集合，作為整個知識庫的事實基準。\n2. **知識庫層（`wiki/`）**：完全由 AI 撰寫與維護的 Markdown 網路，包含內容索引（`index.md`）、時間日誌（`log.md`）與各類主題頁面。\n3. **規範架構層（`AGENTS.md` / `CLAUDE.md`）**：定義目錄結構、頁面格式與標準作業流程（Ingest、Query、Lint），確保 AI 具備紀律地維護知識庫。\n\n## 3. 延伸閱讀與相關頁面\n\n- 回到總覽：[LLM 研究全景與演進脈絡](../overview.md)\n- 對比技術：[檢索增強生成（Retrieval-Augmented Generation, RAG）](retrieval-augmented-generation.md)\n", "wiki/concepts/muscle-hypertrophy.md": "---\ntitle: 肌肥大與訓練負荷效應（Muscle Hypertrophy）\ncategory: concepts\ntags: [Muscle-Hypertrophy, Resistance-Training, Training-Volume, Exercise-Physiology]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - raw/lopez-2021-resistance-training-load.md\n  - raw/bernardez-vazquez-2022-hypertrophy-umbrella-review.md\nstatus: evergreen\n---\n\n# 肌肥大與訓練負荷效應（Muscle Hypertrophy）\n\n> **一句話定義**：骨骼肌纖維橫截面積（CSA）與肌肉體積的增加（涵蓋肌漿肥大與肌原纖維肥大）；在每組訓練皆執行至[自主力竭（Volitional Failure）](volitional-failure.md)的前提下，肌肥大效果對訓練負荷呈現**負荷無關性（Load-Independent）**，而**每週總訓練量（$\\ge 10$ 組／肌群）**才是唯一具備明確漸進劑量效應的核心驅動變項。\n\n## 1. 生理機制與負荷無關性\n\n肌肥大由**肌漿肥大（Sarcoplasmic Hypertrophy，肌肝醣與細胞液增加）**與**肌原纖維肥大（Myofibrillar Hypertrophy，收縮蛋白尺寸與數量增加）**共同構成，其三大經典生理驅動因子為**機械張力（Mechanical Stress）、代謝壓力（Metabolic Stress）與肌肉損傷（Muscle Damage）**。\n\n傳統觀念常將「8–12 RM」視為唯一的「肌肥大區間」，但兩篇高階統合證據已修正此觀點：\n- [Lopez et al. (2021)](../papers/lopez-2021-resistance-training-load.md) 網絡統合分析（24 篇研究，$I^2 = 0\\%$）證實：只要訓練組執行至[自主力竭](volitional-failure.md)，低負荷（$<60\\%$ 1-RM）、中負荷（$60\\%\\text{–}79\\%$ 1-RM）與高負荷（$\\ge 80\\%$ 1-RM）所誘導的肌肥大程度在統計上無顯著差異（$P = 0.113\\text{–}0.469$）。\n- [Bernárdez-Vázquez et al. (2022)](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md) 傘狀回顧進一步指出（Grgic, 2020），低負荷與高負荷練至力竭時，在 **Type I 慢縮肌纖維與 Type II 快縮肌纖維**上皆產生相近的肥大反應；此外，若將低負荷結合[血流限制訓練（BFR）](blood-flow-restriction-training.md)，亦能達成與高負荷相當的肌肥大。\n\n> **觀點整合（2026-11-16）**：綜合 Lopez et al. (2021) 與 Bernárdez-Vázquez et al. (2022)，雖然低負荷練至力竭與高負荷可產生相近的肌肥大，但實務處方上仍建議適度納入高負荷（$>60\\%$ 1-RM），以兼顧[最大肌力（1-RM Strength）](muscle-strength-1rm.md)提升並減少輕重量力竭帶來的高度主觀不適感。\n\n## 2. 真正決定肌肥大振幅的核心變項\n\n結合兩篇文獻的統合迴歸與傘狀回顧證據，影響肌肥大振幅的關鍵因子可分為三個層次：\n\n1. **每週總訓練量（Weekly Volume — 最強劑量效應）**：\n   - 根據 [Bernárdez-Vázquez et al. (2022)](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md)，訓練量是唯一與肌肥大呈現漸進劑量效應的變項：多組訓練（2–3 組）較單組高出 40% 肌肥大，且**每個肌群每週至少執行 10 組（$\\ge 10$ sets/week）**可最大化肌肉增長（詳見[訓練量與訓練頻率](training-volume-and-frequency.md)）。\n2. **訓練經驗與累積課次（Training Status & Sessions）**：\n   - [Lopez et al. (2021)](../papers/lopez-2021-resistance-training-load.md) 顯示，無訓練經驗者（Untrained）因適應空間大，肌肥大增幅顯著高於休閒訓練者（$P = 0.033$）；而有訓練經驗者受限於運動後合成訊號（如 AMPK 與 Akt 磷酸化）鈍化，必須透過**增加總訓練課次與組數（$P = 0.031\\text{–}0.045$）**才能突破高原期。\n3. **收縮模式與動作節奏（Contraction Type & Tempo）**：\n   - **離心收縮（Eccentric）**較向心收縮具小幅肌肥大優勢（10% vs. 6.8%），且兩者具有區域互補性（向心偏重肌腹中段、離心偏重遠端與 Type II 纖維）。\n   - **反覆持續時間**在 **0.5–8 秒**內效果相近，但應**避免單次反覆 $\\ge 10$ 秒的超慢速訓練**，以免降低運動單位徵召效率。\n\n## 3. 對肌肥大無直接顯著影響的變項\n\n在總訓練量與努力程度（接近力竭）受控的前提下，以下變項不會直接改變肌肥大增幅，可完全依個人偏好與時間安排彈性調整：\n- **訓練頻率（Frequency）**：總組數相等時無差異（作為分散組數的工具）。\n- **動作順序（Exercise Order）**：多關節或單關節優先不影響整體肌肥大。\n- **訓練時段（Time of Day）**：早晨與傍晚訓練的長期肌肥大與 p70S6K 合成訊號相近。\n- **週期化模型（Periodization）**：總量相等時，線性週期化（LP）與每日波動式週期化（DUP）效果相當。\n\n## 4. 相關頁面\n\n- 實證來源：[Lopez et al. (2021) 網絡統合分析](../papers/lopez-2021-resistance-training-load.md) ｜ [Bernárdez-Vázquez et al. (2022) 傘狀回顧](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md)\n- 延伸概念：[訓練量與訓練頻率](training-volume-and-frequency.md) ｜ [血流限制訓練（BFR）](blood-flow-restriction-training.md) ｜ [自主力竭與運動單位徵召](volitional-failure.md) ｜ [最大肌力與負荷特異性](muscle-strength-1rm.md)\n- 橫向比較：[低、中、高負荷阻力訓練效果比較表](../comparisons/resistance-training-load-comparison.md) ｜ [肌肥大九大訓練變項實證影響矩陣](../comparisons/hypertrophy-training-variables-matrix.md)\n", "wiki/concepts/muscle-strength-1rm.md": "---\ntitle: 最大肌力與負荷特異性（Muscle Strength & 1-RM）\ncategory: concepts\ntags: [Muscle-Strength, 1-RM, Specificity-Principle, Neural-Adaptation]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - raw/lopez-2021-resistance-training-load.md\nstatus: developing\n---\n\n# 最大肌力與負荷特異性（Muscle Strength & 1-RM）\n\n> **一句話定義**：肌肉在單次最大努力下所能克服的最大外部阻力（通常以一次反覆最大重量 1-RM 衡量）；與[肌肥大](muscle-hypertrophy.md)不同，最大肌力的增長具有高度的**負荷依賴性（Load-Dependent）**，高負荷訓練效果顯著最佳。\n\n## 1. 為什麼最大肌力依賴高負荷？\n\n[Lopez et al. (2021)](../papers/lopez-2021-resistance-training-load.md) 針對 23 篇研究（39 項比較）的網絡統合分析顯示，**高負荷訓練（$\\ge 80\\%$ 1-RM）有 98.2% 的機率成為提升 1-RM 肌力的最佳介入方式**：\n- 高負荷 vs. 低負荷：$\\text{SMD} = 0.60$（高品質研究 $\\text{SMD} = 0.63$，$P < 0.001$，中等正向效果）。\n- 中負荷 vs. 低負荷：$\\text{SMD} = 0.34$（高品質研究 $\\text{SMD} = 0.35$，$P = 0.003$，小幅正向效果）。\n- 高負荷 vs. 中負荷：$\\text{SMD} = 0.26$（$P = 0.068$，呈邊緣顯著優勢）。\n\n背後的兩大核心機制為：\n1. **特異性原則（Principle of Specificity）**：高負荷訓練（$\\le 8$ RM）在動作力學、神經募集模式與高張力輸出上更貼近 1-RM 最大肌力測試的情境，具備最高的遷移效應。\n2. **神經系統適應（Neural Adaptations）**：高負荷能誘發更強的神經驅動（Neural Drive）、運動單位放電頻率（Rate Coding）以及主動肌／拮抗肌協調能力，這些適應無法單靠輕重量高次數完全複製。\n\n## 2. 調節因子與實驗設計注意事項\n\n- **測試暴露效應（Testing Exposure）**：部分研究在介入期間進行多次（3–5 次）1-RM 測試，這本身就會給低負荷組提供額外的高重量神經刺激，可能縮小低負荷與高負荷組之間的真實肌力差距。\n- **性別與研究年代**：統合迴歸指出較早期研究（如 1982 年使用 100–150 RM 的研究）與男性樣本在高低負荷比較中顯示較大肌力差異；現代嚴謹控制的實驗設計則呈現更穩健的中等效果量。\n\n## 3. 相關頁面\n\n- 實證來源：[Lopez et al. (2021) 網絡統合分析](../papers/lopez-2021-resistance-training-load.md)\n- 對比概念：[肌肥大與訓練負荷效應（Muscle Hypertrophy）](muscle-hypertrophy.md)\n- 橫向比較：[低、中、高負荷阻力訓練效果比較表](../comparisons/resistance-training-load-comparison.md)\n", "wiki/concepts/retrieval-augmented-generation.md": "---\ntitle: 檢索增強生成（Retrieval-Augmented Generation, RAG）\ncategory: concepts\ntags: [RAG, Information-Retrieval, Knowledge-Grounding]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - AGENTS.md\nstatus: developing\n---\n\n# 檢索增強生成（Retrieval-Augmented Generation, RAG）\n\n> **一句話定義**：在大型語言模型生成回答前，先從外部資料庫檢索相關文檔片段並注入上下文（Context），以降低幻覺並補充最新或私有知識的技術架構。\n\n## 1. 核心運作流程\n\n1. **文件切塊與向量化（Chunking & Embedding）**：將原始文件切分為段落，透過 Embedding 模型轉為向量並存入向量資料庫。\n2. **查詢檢索（Retrieval）**：將使用者問題轉為向量，透過相似度搜尋（或混合 BM25 關鍵字檢索）找回最相關的 Top-K 片段。\n3. **增強生成（Augmented Generation）**：將檢索結果與原始問題組合成 Prompt，交由 LLM 綜合生成答案。\n\n## 2. 優勢與局限性\n\n- **優勢**：無需重新訓練模型即可接入海量動態資料，且能追溯引用來源。\n- **局限性**：面對需要跨多份文獻進行高層次綜合、或偵測不同時期文獻矛盾的問題時，單次查詢檢索往往難以拼湊完整全貌。\n\n## 3. 與 LLM Wiki 的互補關係\n\n在中小規模研究（數十至數百篇文獻）中，透過 [LLM Wiki 知識庫架構模式](llm-wiki-pattern.md) 預先將文獻編譯為結構化索引與概念頁，能大幅減少對複雜向量基礎設施的依賴；當知識庫規模進一步擴大時，兩者亦可結合使用。\n\n## 4. 相關頁面\n\n- 概念對比：[LLM Wiki 知識庫架構模式](llm-wiki-pattern.md)\n- 領域總覽：[LLM 研究全景與演進脈絡](../overview.md)\n", "wiki/concepts/training-volume-and-frequency.md": "---\ntitle: 訓練量與訓練頻率（Training Volume & Frequency）\ncategory: concepts\ntags: [Training-Volume, Training-Frequency, Dose-Response, Muscle-Hypertrophy, Program-Design]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - raw/bernardez-vazquez-2022-hypertrophy-umbrella-review.md\n  - raw/lopez-2021-resistance-training-load.md\nstatus: evergreen\n---\n\n# 訓練量與訓練頻率（Training Volume & Frequency）\n\n> **一句話定義**：**訓練量（Volume）**指特定週期內完成的總作功或有效組數（每肌群每週組數），是唯一與[肌肥大](muscle-hypertrophy.md)呈明確漸進劑量效應的核心變項；**訓練頻率（Frequency）**則是每週訓練特定肌群的次數，當總訓練量固定時對肌肥大無直接影響，實務上主要作為「分配訓練量與優化恢復」的調節工具。\n\n## 1. 訓練量的漸進劑量效應（Dose-Response Relationship）\n\n根據 [Bernárdez-Vázquez et al. (2022)](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md) 彙整兩項關鍵統合分析的實證結果：\n\n1. **單組 vs. 多組效益（Krieger, 2010）**：\n   - 無論在有訓練經驗或無訓練經驗者中，每個動作執行 **2–3 組**所帶來的肌肥大效果較單組高出 **40%**。\n   - 執行 4–6 組雖呈現進一步提升的趨勢，但受限於納入研究數量較少，尚未能確立統計顯著差異。\n2. **每週組數門檻與高原期（Schoenfeld et al., 2017a）**：\n   - **最低有效劑量**：即使每週每個肌群僅執行 **$\\le 4$ 組**（低訓練量），仍足以產生實質性的肌肥大增長，適合時間受限或需保存體能的族群。\n   - **最佳化目標劑量**：要最大化肌肉量增長，**每個肌群每週至少需要執行 10 組（$\\ge 10$ sets/week）**。\n   - **高原期與過度訓練風險**：肌肉蛋白質合成速率隨訓練量增加至特定閾值後便會趨於平穩（Plateau）；超過此上限繼續堆疊組數不僅無法換取額外肌肥大，反而會大幅提高過度訓練（Overtraining）風險。\n3. **訓練經驗的調節作用（Lopez et al., 2021）**：\n   - [Lopez et al. (2021)](../papers/lopez-2021-resistance-training-load.md) 的網絡統合迴歸進一步證實，**累積總訓練課次（Number of Sessions）**與肌肥大呈顯著正相關（$P = 0.031\\text{–}0.045$）；對於具 2–7 年訓練經驗、適應邊際效益已遞減的訓練者，增加總訓練量與課次是突破高原期的關鍵。\n\n## 2. 訓練頻率的角色：總量守恆原則\n\nSchoenfeld et al. (2019a) 統合 25 篇研究（$N=836$，$I^2=0\\%$）揭示了訓練頻率的雙面效應：\n- **當每週總組數相等（Volume-Equated）時**：每週練 1 次、2 次或 3 次對肌肥大**沒有顯著差異**。這意味著「頻率本身」並非獨立的生理驅動因子。\n- **當每週總組數未固定（Non-Equated）時**：較高的訓練頻率展現顯著的肌肥大優勢，原因在於將高組數拆分為多次訓練，能讓每次訓練維持更高的動作品質與努力強度，並縮短單次課表的疲勞累積。\n- **過度訓練警示**：高頻率若長期搭配高強度且缺乏減量期（Tapering），將導致運動表現迅速下滑與過度訓練。\n\n## 3. 實務課表設計建議\n\n- **新手與時間受限者**：每肌群每週 4–9 組、每週訓練 1–2 次，即可獲得高性價比的初期肌肥大適應。\n- **進階肌肥大目標者**：將每肌群每週總組數提升至 **10–20 組**，並透過**提高訓練頻率（例如每肌群每週練 2–3 次，每次 4–6 組）**來分散單次訓練疲勞，避免單次課表後段組數因過度疲勞而淪為無效垃圾訓練量。\n\n## 4. 相關頁面\n\n- 實證來源：[Bernárdez-Vázquez et al. (2022) 傘狀回顧](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md) ｜ [Lopez et al. (2021) 網絡統合分析](../papers/lopez-2021-resistance-training-load.md)\n- 核心概念：[肌肥大與訓練負荷效應（Muscle Hypertrophy）](muscle-hypertrophy.md)\n- 橫向比較：[肌肥大九大訓練變項實證影響矩陣](../comparisons/hypertrophy-training-variables-matrix.md)\n", "wiki/concepts/volitional-failure.md": "---\ntitle: 自主力竭與運動單位徵召（Volitional Failure）\ncategory: concepts\ntags: [Volitional-Failure, Motor-Unit-Recruitment, Henneman-Size-Principle, Fatigue]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - raw/lopez-2021-resistance-training-load.md\n  - raw/bernardez-vazquez-2022-hypertrophy-umbrella-review.md\nstatus: evergreen\n---\n\n# 自主力竭與運動單位徵召（Volitional Failure）\n\n> **一句話定義**：在阻力訓練的一組動作中持續執行反覆次數，直到受試者儘管付出最大努力仍無法以正確姿勢完成下一次向心收縮的狀態；它是使低負荷訓練得以達成與高負荷相當[肌肥大](muscle-hypertrophy.md)的關鍵生理條件。\n\n## 1. 生理機制：Henneman 尺寸原則\n\n根據 **Henneman 尺寸原則（Henneman's Size Principle）**，神經系統徵召運動單位的順序是由小（低閾值、慢縮肌纖維）到大（高閾值、快縮肌纖維）：\n- **高負荷訓練（$\\ge 80\\%$ 1-RM）**：由於外部阻力極大，從組內第一下反覆開始就必須徵召幾乎全部的高閾值運動單位。\n- **低負荷訓練（$<60\\%$ 1-RM）**：初期反覆僅需徵召低閾值運動單位；但隨著反覆次數累積與神經肌肉疲勞加劇，先參與的肌纖維力量下降，迫使中樞神經系統逐步徵召高閾值運動單位來維持輸出，最終在接近**自主力竭**時達成近乎完整的運動單位池徵召（在 Type I 與 Type II 纖維皆能產生相近肥大）。\n\n## 2. 動作節奏與低負荷替代路徑的交互作用\n\n結合 [Bernárdez-Vázquez et al. (2022)](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md) 的傘狀回顧證據，力竭機制在實務操作上有兩項重要補充：\n1. **動作節奏的速度閾值限制**：即使執行至向心肌肉力竭，單次反覆持續時間在 **0.5–8 秒**之間皆可有效誘發肌肥大；但若刻意放慢至 **$\\ge 10$ 秒／次**，肌肥大效果會顯著下降，顯示過低的收縮速度會限制高閾值運動單位的完整徵召。\n2. **血流限制訓練（BFR）作為低不適替代方案**：傳統輕重量練至力竭需耗費大量反覆次數與時間；若搭配[血流限制訓練（BFR）](blood-flow-restriction-training.md)，可藉由局部缺氧加速疲勞累積，在更少反覆次數下達成高閾值徵召與同等肌肥大。\n\n## 3. 研究方法學意義與實務代價\n\n- **研究標準化工具**：在運動科學實驗中，要求不同負荷組別皆執行至自主力竭，是用來消除個體間肌耐力差異、確保各組承受相似相對刺激強度的標準化策略（Lopez et al., 2021）。\n- **實務應用代價**：\n  - 日常訓練**接近力竭（保留 1–2 下餘力，RIR 1–2）**或適度達力竭即可充分刺激肌肥大，無需每組皆拚至力竭而過度累積中樞疲勞。\n  - 若使用輕重量（$>15$ RM）每組都練到完全力竭，會產生極高的代謝壓力、主觀不適感（RPE）以及較長的訓練時間，因此實務上對一般族群而言，採用中至高負荷往往比「輕重量拚力竭」更易於長期執行。\n\n## 4. 相關頁面\n\n- 實證來源：[Lopez et al. (2021) 網絡統合分析](../papers/lopez-2021-resistance-training-load.md) ｜ [Bernárdez-Vázquez et al. (2022) 傘狀回顧](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md)\n- 延伸概念：[肌肥大與訓練負荷效應（Muscle Hypertrophy）](muscle-hypertrophy.md) ｜ [血流限制訓練（BFR）](blood-flow-restriction-training.md) ｜ [最大肌力與負荷特異性（Muscle Strength & 1-RM）](muscle-strength-1rm.md)\n", "wiki/models/hypertrophy-mechanisms-model.md": "---\ntitle: 肌肥大三大生理驅動機制模型（Three Mechanisms of Hypertrophy）\ncategory: models\ntags: [Muscle-Hypertrophy, Mechanical-Tension, Metabolic-Stress, Muscle-Damage, Theoretical-Model]\ncreated: 2026-11-16\nupdated: 2026-11-16\nsources:\n  - raw/bernardez-vazquez-2022-hypertrophy-umbrella-review.md\n  - raw/lopez-2021-resistance-training-load.md\nstatus: evergreen\n---\n\n# 肌肥大三大生理驅動機制模型（Three Mechanisms of Hypertrophy）\n\n> **模型核心定義**：由 Brad Schoenfeld 提出並於 [Bernárdez-Vázquez et al. (2022)](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md) 傘狀回顧中採用的經典生理框架，主張阻力訓練誘導骨骼肌肥大主要透過**機械張力（Mechanical Tension）**、**代謝壓力（Metabolic Stress）**與**運動誘發肌肉損傷（Exercise-Induced Muscle Damage, EIMD）**三條路徑協同啟動合成代謝訊號。\n\n## 1. 三大路徑與訓練處方對應\n\n| 驅動機制 | 生理訊號與細胞反應 | 對應訓練條件與實證佐證 |\n| :--- | :--- | :--- |\n| **機械張力（Mechanical Tension）** | 肌節受力變形啟動整合素與力學感測器（Mechanosensors），活化 mTORC1 路徑並促進肌原纖維蛋白合成 | 高負荷訓練（$\\ge 80\\%$ 1-RM）、完整離心控制，以及[每週 $\\ge 10$ 組訓練量](../concepts/training-volume-and-frequency.md)的累積機械作功 |\n| **代謝壓力（Metabolic Stress）** | 乳酸、氫離子（$\\text{H}^+$）與無機磷酸鹽堆積，引發細胞腫脹（Cell Swelling）與提早徵召高閾值運動單位 | 低負荷練至[自主力竭](../concepts/volitional-failure.md)（$<60\\%$ 1-RM）或搭配[血流限制訓練（BFR）](../concepts/blood-flow-restriction-training.md) |\n| **肌肉損傷（Muscle Damage）** | 肌纖維微細結構受損引發局部發炎反應與衛星細胞（Satellite Cells）增殖分化 | 離心收縮階段（Eccentric Phase）與新穎動作刺激（過度損傷反而不利恢復） |\n\n## 2. 跨研究整合洞見\n\n1. **為何不同負荷能達成相近肌肥大？**\n   - 根據 [Lopez et al. (2021)](../papers/lopez-2021-resistance-training-load.md)，高負荷訓練（$\\ge 80\\%$ 1-RM）從第一下反覆即產生極高**機械張力**；而低負荷訓練（$<60\\%$ 1-RM）練至[自主力竭](../concepts/volitional-failure.md)時，則透過累積高度**代謝壓力**與慢縮纖維疲勞，最終徵召同樣的高閾值運動單位。\n2. **血流限制訓練（BFR）的機制定位**：\n   - [血流限制訓練（BFR）](../concepts/blood-flow-restriction-training.md)透過外部加壓人為放大**代謝壓力**與局部缺氧，使 $20\\text{–}30\\%$ 1-RM 的極輕負荷無需高機械張力即可達成等同重訓的[肌肥大](../concepts/muscle-hypertrophy.md)效果。\n\n## 3. 相關頁面\n\n- 論文精讀：[Bernárdez-Vázquez et al. (2022) 傘狀回顧](../papers/bernardez-vazquez-2022-hypertrophy-umbrella-review.md) ｜ [Lopez et al. (2021) 網絡統合分析](../papers/lopez-2021-resistance-training-load.md)\n- 核心概念：[肌肥大與訓練負荷效應](../concepts/muscle-hypertrophy.md) ｜ [訓練量與訓練頻率](../concepts/training-volume-and-frequency.md) ｜ [血流限制訓練（BFR）](../concepts/blood-flow-restriction-training.md) ｜ [自主力竭與運動單位徵召](../concepts/volitional-failure.md)\n- 橫向比較：[低、中、高負荷阻力訓練效果橫向比較表](../comparisons/resistance-training-load-comparison.md) ｜ [肌肥大九大訓練變項實證影響矩陣](../comparisons/hypertrophy-training-variables-matrix.md)\n"};

          banner.style.display = "block";
          banner.innerHTML =
            "💡 <strong>本地離線預覽模式（file://）</strong>：目前以雙擊檔案方式開啟，已自動切換為內建知識庫快照供完整瀏覽；部署至 <strong>GitHub Pages</strong> 或執行 <code>python -m http.server 8000</code> 後將即時讀取最新 <code>.md</code> 檔案。";
        }
        return window.__EMBEDDED_WIKI__[path];
      }
      throw new Error("Page not found: " + path);
    }

    function parseFrontmatter(md) {
      const match = md.match(/^---\s*\n([\s\S]*?)\n---\s*\n/);
      if (!match) return { meta: {}, body: md };
      const rawMeta = match[1];
      const body = md.slice(match[0].length);
      const meta = {};
      rawMeta.split("\n").forEach(line => {
        const idx = line.indexOf(":");
        if (idx > 0) {
          const key = line.slice(0, idx).trim();
          const val = line.slice(idx + 1).trim();
          if (val) meta[key] = val;
        }
      });
      return { meta, body };
    }

    function resolveRelativePath(baseFile, targetHref) {
      if (targetHref.startsWith("http://") || targetHref.startsWith("https://")) return targetHref;
      if (targetHref.startsWith("wiki/") || targetHref === "AGENTS.md" || targetHref === "README.md") {
        return targetHref;
      }
      const baseParts = baseFile.split("/");
      baseParts.pop();
      const targetParts = targetHref.split("/");
      for (const part of targetParts) {
        if (part === "." || part === "") continue;
        if (part === "..") baseParts.pop();
        else baseParts.push(part);
      }
      return baseParts.join("/");
    }

    async function loadSidebar() {
      try {
        const text = await readMarkdownFile("wiki/index.md");
        const lines = text.split("\n");
        const navContainer = document.getElementById("navContainer");
        navContainer.innerHTML = "";
        allNavItems = [];

        lines.forEach(line => {
          if (line.startsWith("## ")) {
            const sec = document.createElement("div");
            sec.className = "nav-section-title";
            sec.textContent = line.replace("## ", "").trim();
            navContainer.appendChild(sec);
          } else {
            const linkMatch = line.match(/^-\s+\[([^\]]+)\]\(([^)]+)\)/);
            if (linkMatch) {
              const title = linkMatch[1];
              const relPath = linkMatch[2];
              const fullPath = relPath.startsWith("wiki/") ? relPath : `wiki/${relPath}`;
              const a = document.createElement("a");
              a.className = "nav-item";
              a.textContent = title;
              a.dataset.path = fullPath;
              a.onclick = () => loadPage(fullPath);
              navContainer.appendChild(a);
              allNavItems.push({ el: a, title: title.toLowerCase(), path: fullPath });
            }
          }
        });

        document.querySelectorAll(".system-links .nav-item").forEach(a => {
          a.onclick = () => loadPage(a.dataset.path);
        });
      } catch (err) {
        document.getElementById("navContainer").innerHTML =
          "<p style='font-size:0.85rem;color:#ef4444;'>無法載入 wiki/index.md（請確認透過 HTTP Server 或 GitHub Pages 開啟）。</p>";
      }
    }

    async function loadPage(path) {
      currentPath = path;
      document.querySelectorAll(".nav-item").forEach(el => {
        el.classList.toggle("active", el.dataset.path === path);
      });

      try {
        const raw = await readMarkdownFile(path);
        const { meta, body } = parseFrontmatter(raw);

        const metaBar = document.getElementById("metaBar");
        if (Object.keys(meta).length > 0) {
          metaBar.style.display = "flex";
          metaBar.innerHTML = "";
          if (meta.category) metaBar.innerHTML += `<span class="badge">分類：${meta.category}</span>`;
          if (meta.status) metaBar.innerHTML += `<span class="badge muted">狀態：${meta.status}</span>`;
          if (meta.updated) metaBar.innerHTML += `<span class="badge muted">更新：${meta.updated}</span>`;
          if (meta.tags) metaBar.innerHTML += `<span class="badge muted">標籤：${meta.tags}</span>`;
        } else {
          metaBar.style.display = "none";
        }

        const contentEl = document.getElementById("content");
        contentEl.innerHTML = marked.parse(body);

        // Intercept internal markdown links & resolve relative asset/PDF links
        contentEl.querySelectorAll("a").forEach(a => {
          const href = a.getAttribute("href");
          if (!href || href.startsWith("http://") || href.startsWith("https://") || href.startsWith("#")) return;
          const resolved = resolveRelativePath(currentPath, href);
          if (href.endsWith(".md")) {
            a.onclick = (e) => {
              e.preventDefault();
              loadPage(resolved);
            };
          } else {
            a.setAttribute("href", resolved);
            a.setAttribute("target", "_blank");
          }
        });

        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (err) {
        document.getElementById("content").innerHTML =
          `<h2>找不到頁面：${path}</h2><p>請確認該檔案是否存在於知識庫中，或請 AI Agent 檢查 <code>wiki/index.md</code> 連結路徑。</p>`;
      }
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      allNavItems.forEach(item => {
        item.el.style.display = item.title.includes(q) ? "block" : "none";
      });
    });

    (async () => {
      await loadSidebar();
      const initialHash = window.location.hash.replace("#", "");
      await loadPage(initialHash || "wiki/overview.md");
    })();
  </script>
</body>
</html>
